apiVersion: v1
kind: ServiceAccount
metadata:
  name: shinyproxy-sa
  namespace: shiny
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: shinyproxy-role
  namespace: shiny
rules:
- apiGroups: [""]
  resources: ["pods", "pods/log", "services", "endpoints", "events"]
  verbs: ["get", "list", "watch", "create", "delete"]
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: shinyproxy-rolebinding
  namespace: shiny
subjects:
- kind: ServiceAccount
  name: shinyproxy-sa
  namespace: shiny
roleRef:
  kind: Role
  name: shinyproxy-role
  apiGroup: rbac.authorization.k8s.io
